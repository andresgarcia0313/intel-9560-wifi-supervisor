# /etc/systemd/system/dell-net-guardian.service.d/reserva.conf
# El guardian anterior queda de reserva: actua solo si el controlador nuevo no esta activo (detenido,
# en failed o desinstalado) o si esta en modo observar, que no repara. Ademas toma el mismo cerrojo que
# el controlador (flock), asi nunca actuan los dos a la vez sobre la tarjeta, ni durante un reinicio.
[Service]
ExecCondition=/bin/sh -c "! systemctl is-active --quiet controlador-radio.service || grep -qs '^modo = .observar' /etc/controlador-radio/config.toml"
ExecStart=
ExecStart=/usr/bin/flock -n -E 0 /run/lock/controlador-radio.lock /usr/local/bin/dell-net-guardian.sh
