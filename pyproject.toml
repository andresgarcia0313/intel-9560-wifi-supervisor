[project]
name = "intel-9560-wifi-supervisor"
version = "1.3.0"
description = "Supervisor y recuperacion de la wifi Intel Wireless-AC 9560 (iwlwifi) y su Bluetooth en Linux"
readme = "README.md"
license = "MIT"
authors = [{ name = "Andrés García" }]
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = ["PLR2004", "PLR0911", "PLC0415", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["radio_dell"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
